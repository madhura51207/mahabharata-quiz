<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <defs>
    <linearGradient id="featherStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C058"/>
      <stop offset="100%" stop-color="#8F6A17"/>
    </linearGradient>
    <radialGradient id="eyeBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001845"/>
