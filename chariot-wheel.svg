<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="wheelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE898"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8F6817"/>
    </linearGradient>
  </defs>
  <!-- Outer Wheel Rim -->
  <circle cx="50" cy="50" r="46" stroke="url(#wheelGold)" stroke-width="4"/>
  <circle cx="50" cy="50" r="41" stroke="url(#wheelGold)" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="50" cy="50" r="37" stroke="url(#wheelGold)" stroke-width="1.5"/>
  <!-- Central Hub -->
  <circle cx="50" cy="50" r="14" stroke="url(#wheelGold)" stroke-width="3" fill="#0B132B"/>
  <circle cx="50" cy="50" r="8" fill="url(#wheelGold)"/>
  <circle cx="50" cy="50" r="3" fill="#0B132B"/>
  <!-- 16 Spokes -->
  <g stroke="url(#wheelGold)" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="13" x2="50" y2="36" />
    <line x1="50" y1="64" x2="50" y2="87" />
    <line x1="13" y1="50" x2="36" y2="50" />
    <line x1="64" y1="50" x2="87" y2="50" />
    <line x1="24" y1="24" x2="40" y2="40" />
    <line x1="60" y1="60" x2="76" y2="76" />
    <line x1="76" y1="24" x2="60" y2="40" />
    <line x1="40" y1="60" x2="24" y2="76" />
    <line x1="36" y1="16" x2="44" y2="37" />
    <line x1="64" y1="16" x2="56" y2="37" />
    <line x1="84" y1="36" x2="63" y2="44" />
    <line x1="84" y1="64" x2="63" y2="56" />
    <line x1="64" y1="84" x2="56" y2="63" />
    <line x1="36" y1="84" x2="44" y2="63" />
    <line x1="16" y1="64" x2="37" y2="56" />
    <line x1="16" y1="36" x2="37" y2="44" />
  </g>
</svg>
